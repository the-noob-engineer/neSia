[package]
name = "libnesia"
version = "0.0.1"
edition = "2024"

[workspace]
members = [
    "crates/ns_ast",
    "crates/ns_bytecode",
    "crates/ns_compiler",
    "crates/ns_hir",
    "crates/ns_lexer",
    "crates/ns_parser",
    "crates/ns_runtime",
    "crates/ns_std",
    "crates/ns_types",
    "crates/ns_vm",
]
resolver = "2"


[[bin]]
name = "nesiac"
path = "./src/bin/nesiac.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.35"
ns_lexer = {path =  "crates/ns_lexer"}
